name: Build Chiptone

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: SDK de Android del runner
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Compilar APK Owner (todo desbloqueado)
        run: gradle assembleOwnerRelease --no-daemon --stacktrace

      - name: Compilar AAB Play (para Google Play)
        run: gradle bundlePlayRelease --no-daemon

      - name: Renombrar
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/owner/release/*.apk dist/chiptone-owner.apk
          cp app/build/outputs/bundle/playRelease/*.aab dist/chiptone-play.aab

      - uses: actions/upload-artifact@v4
        with:
          name: chiptone-build-${{ github.run_number }}
          path: dist/*

      - name: Publicar descarga (Release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Chiptone Owner · build ${{ github.run_number }}
          body: "Descarga **chiptone-owner.apk** en el celular e instálalo. El .aab es para subir a Google Play más adelante."
          prerelease: true
          files: |
            dist/chiptone-owner.apk
            dist/chiptone-play.aab
